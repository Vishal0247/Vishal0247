<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Vishal Tiwari" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E14"/>
      <stop offset="0.55" stop-color="#0E2F2E"/>
      <stop offset="1" stop-color="#2DD4A6"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes w1 { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    @keyframes w2 { from { transform: translateX(-1000px); } to { transform: translateX(0); } }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .a { animation: w1 9s linear infinite; }
    .b { animation: w2 14s linear infinite; }
    .t1 { animation: fade 1.2s ease-out both; }
    .t2 { animation: fade 1.2s ease-out .5s both; }
    .ul { transform-box: fill-box; transform-origin: center; animation: grow 1.2s ease-out 1s both; }
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  </style>
  <rect width="1000" height="220" fill="url(#g)"/>
  <path class="a" d="M0 170 Q125 140 250 170 T500 170 T750 170 T1000 170 T1250 170 T1500 170 T1750 170 T2000 170 V220 H0 Z" fill="#2DD4A6" fill-opacity="0.22"/>
  <path class="b" d="M0 185 Q125 160 250 185 T500 185 T750 185 T1000 185 T1250 185 T1500 185 T1750 185 T2000 185 V220 H0 Z" fill="#E8A94C" fill-opacity="0.16"/>
