<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" role="img" aria-label="Animated coding robot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .m { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .fb { transform-box: fill-box; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    @keyframes tapL { 0%,100% { transform: translateY(0); } 25% { transform: translateY(-4px); } 50% { transform: translateY(0); } }
    @keyframes tapR { 0%,100% { transform: translateY(0); } 50% { transform: translateY(0); } 75% { transform: translateY(-4px); } }
    @keyframes typeLine { 0% { transform: scaleX(0); } 14%,86% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-38px); opacity: 0; } }
    @keyframes cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .robot { animation: bob 3s ease-in-out infinite; }
    .eye { animation: blink 4.5s infinite; transform-origin: center; }
    .led { animation: pulse 1.4s ease-in-out infinite; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .handL { animation: tapL 0.7s linear infinite; }
    .handR { animation: tapR 0.7s linear infinite; }
    .ln { transform-origin: left center; animation: typeLine 7s ease-in-out infinite; }
    .sym { animation: rise 4s ease-in infinite; }
    .cur { animation: cursor 1s steps(1) infinite; }
  </style>

  <rect x="1" y="1" width="458" height="278" rx="18" fill="#0A0E14" stroke="#2DD4A6" stroke-opacity="0.25" stroke-width="2"/>

  <!-- stars -->
  <circle class="star" cx="40" cy="36" r="1.6" fill="#fff"/>
  <circle class="star" cx="150" cy="24" r="1.2" fill="#fff" style="animation-delay:.8s"/>
  <circle class="star" cx="260" cy="40" r="1.4" fill="#fff" style="animation-delay:1.6s"/>
  <circle class="star" cx="330" cy="22" r="1.2" fill="#fff" style="animation-delay:.4s"/>
  <circle class="star" cx="60" cy="150" r="1.2" fill="#fff" style="animation-delay:2s"/>
  <circle class="star" cx="438" cy="80" r="1.4" fill="#fff" style="animation-delay:1.2s"/>

  <!-- moon -->
  <circle cx="410" cy="40" r="16" fill="#E8A94C"/>
  <circle cx="418" cy="34" r="14" fill="#0A0E14"/>

  <!-- floating symbols -->
  <g class="m" font-size="14" font-weight="700">
    <text class="sym" x="250" y="88" fill="#2DD4A6">&lt;/&gt;</text>
    <text class="sym" x="330" y="88" fill="#E8A94C" style="animation-delay:1.3s">{ }</text>
    <text class="sym" x="400" y="88" fill="#2DD4A6" style="animation-delay:2.6s">;</text>
    <text class="sym" x="20" y="70" fill="#E8A94C" style="animation-delay:.6s">01</text>
  </g>

  <!-- code window -->
  <rect x="235" y="94" width="205" height="114" rx="10" fill="#0F1622" stroke="#2DD4A6" stroke-opacity="0.5"/>
  <rect x="235" y="94" width="205" height="18" rx="10" fill="#161F2E"/>
  <rect x="235" y="102" width="205" height="10" fill="#161F2E"/>
  <circle cx="249" cy="103" r="3" fill="#E8A94C"/>
  <circle cx="260" cy="103" r="3" fill="#2DD4A6"/>
  <circle cx="271" cy="103" r="3" fill="#8B949E"/>

  <g>
    <rect class="ln fb" x="250" y="122" width="90"  height="6" rx="3" fill="#2DD4A6" style="animation-delay:0s"/>
    <rect class="ln fb" x="262" y="136" width="120" height="6" rx="3" fill="#E8A94C" style="animation-delay:.45s"/>
    <rect class="ln fb" x="262" y="150" width="70"  height="6" rx="3" fill="#8B949E" style="animation-delay:.9s"/>
    <rect class="ln fb" x="250" y="164" width="140" height="6" rx="3" fill="#2DD4A6" style="animation-delay:1.35s"/>
    <rect class="ln fb" x="262" y="178" width="100" height="6" rx="3" fill="#E8A94C" style="animation-delay:1.8s"/>
    <rect class="ln fb" x="250" y="192" width="60"  height="6" rx="3" fill="#8B949E" style="animation-delay:2.25s"/>
    <rect class="cur" x="316" y="190" width="6" height="10" fill="#2DD4A6"/>
  </g>

  <!-- desk + keyboard -->
  <rect x="20" y="232" width="420" height="6" rx="3" fill="#1B2430"/>
  <rect x="62" y="224" width="96" height="8" rx="3" fill="#161F2E" stroke="#2DD4A6" stroke-opacity="0.5"/>

  <!-- robot -->
  <g class="robot">
    <line x1="110" y1="52" x2="110" y2="68" stroke="#2DD4A6" stroke-width="3" stroke-linecap="round"/>
    <circle class="led" cx="110" cy="47" r="5" fill="#E8A94C"/>

    <rect x="57" y="88" width="8" height="30" rx="3" fill="#2DD4A6"/>
    <rect x="155" y="88" width="8" height="30" rx="3" fill="#2DD4A6"/>
    <rect x="65" y="68" width="90" height="70" rx="18" fill="#111826" stroke="#2DD4A6" stroke-width="3"/>
    <rect x="77" y="80" width="66" height="46" rx="10" fill="#0A0E14"/>
    <circle class="eye fb" cx="97"  cy="101" r="7" fill="#2DD4A6"/>
    <circle class="eye fb" cx="123" cy="101" r="7" fill="#2DD4A6"/>
    <path d="M100 116 Q110 123 120 116" stroke="#E8A94C" stroke-width="3" fill="none" stroke-linecap="round"/>

    <rect x="80" y="142" width="60" height="78" rx="14" fill="#111826" stroke="#2DD4A6" stroke-width="3"/>
    <circle class="led" cx="110" cy="166" r="6" fill="#E8A94C" style="animation-delay:.5s"/>
    <rect x="94" y="184" width="32" height="4" rx="2" fill="#2DD4A6" opacity=".6"/>
    <rect x="98" y="194" width="24" height="4" rx="2" fill="#2DD4A6" opacity=".35"/>

    <g class="handL fb">
      <line x1="82" y1="156" x2="80" y2="218" stroke="#2DD4A6" stroke-width="7" stroke-linecap="round"/>
      <circle cx="80" cy="220" r="7" fill="#E8A94C"/>
    </g>
    <g class="handR fb">
      <line x1="138" y1="156" x2="140" y2="218" stroke="#2DD4A6" stroke-width="7" stroke-linecap="round"/>
      <circle cx="140" cy="220" r="7" fill="#E8A94C"/>
    </g>
  </g>

  <text class="m" x="230" y="262" text-anchor="middle" font-size="12" fill="#2DD4A6" fill-opacity="0.85">while (alive) { learn(); build(); ship(); }</text>
</svg>
